<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc Nghiệm Giáo Dục Quốc Phòng 1 & 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --danger: #EF4444;
            --bg-main: #F3F4F6;
            --bg-card: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #4B5563;
            --border: #E5E7EB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .container.playing {
                grid-template-columns: 1fr 300px;
            }
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 24px;
            border: 1px solid var(--border);
        }

        h1, h2 {
            color: var(--text-main);
            margin-bottom: 16px;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        /* Setup Screen Controls */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-main);
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #FFF;
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: #FFF;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: var(--text-muted);
        }

        .btn-secondary:hover {
            background-color: #374151;
        }

        /* Quiz Area */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .badge {
            background: #EEF2F6;
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-item {
            padding: 14px 18px;
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 1rem;
            line-height: 1.5;
        }

        .option-item:hover {
            background-color: #F9FAFB;
            border-color: #9CA3AF;
        }

        .option-item.selected {
            background-color: #EEF2FF;
            border-color: var(--primary);
            color: var(--primary);
            font-weight: 500;
        }

        /* Practice mode styles */
        .option-item.correct {
            background-color: #D1FAE5 !important;
            border-color: var(--success) !important;
            color: #065F46 !important;
            font-weight: 600;
        }

        .option-item.incorrect {
            background-color: #FEE2E2 !important;
            border-color: var(--danger) !important;
            color: #991B1B !important;
        }

        .option-prefix {
            font-weight: 700;
            min-width: 20px;
        }

        .nav-actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        /* Navigation Sidebar */
        .sidebar-card {
            display: flex;
            flex-direction: column;
            max-height: 80vh;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 8px;
            overflow-y: auto;
            padding-right: 4px;
            margin-top: 12px;
        }

        .grid-item {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F3F4F6;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .grid-item:hover {
            background: #E5E7EB;
        }

        .grid-item.active {
            border: 2px solid var(--primary);
            font-weight: 700;
        }

        .grid-item.filled {
            background: #EEF2FF;
            color: var(--primary);
            border-color: #C7D2FE;
        }

        .grid-item.right {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .grid-item.wrong {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        /* Result View */
        .result-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin: 24px 0;
        }

        .stat-box {
            background: #F9FAFB;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-num {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <!-- Main Panel -->
        <div class="main-panel">
            
            <!-- 1. Cấu hình ban đầu -->
            <div id="setupView" class="card">
                <h1>Học Trắc Nghiệm GDQP</h1>
                <p class="subtitle">Ứng dụng ôn tập thông minh hỗ trợ học tập và thi thử trực quan.</p>
                
                <div class="form-group">
                    <label for="moduleSelect">Chọn phân môn học:</label>
                    <select id="moduleSelect">
                        <option value="ALL">Tất cả câu hỏi (GDQP 1 & 2)</option>
                        <option value="GDQP1">Giáo dục Quốc phòng 1</option>
                        <option value="GDQP2">Giáo dục Quốc phòng 2</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="modeSelect">Chọn chế độ học tập:</label>
                    <select id="modeSelect">
                        <option value="PRACTICE">Luyện tập (Check đáp án TỪNG CÂU ngay khi chọn)</option>
                        <option value="EXAM">Thi thử (Lưu bài và Check đáp án KHI XONG HẾT)</option>
                    </select>
                </div>

                <button class="btn" id="startBtn" style="width: 100%; padding: 14px;">Bắt Đầu Làm Bài</button>
            </div>

            <!-- 2. Giao diện câu hỏi -->
            <div id="quizView" class="card hidden">
                <div class="quiz-header">
                    <span class="badge" id="quizProgress">Câu hỏi 1/10</span>
                    <span class="badge" id="quizModeBadge" style="background:#E0E7FF; color:var(--primary);">Chế độ</span>
                </div>

                <div class="question-text" id="questionText">Nội dung câu hỏi đang tải...</div>

                <div class="options-list" id="optionsContainer">
                    <!-- Danh sách câu trả lời -->
                </div>

                <div class="nav-actions">
                    <button class="btn btn-secondary" id="prevBtn">Câu Trước</button>
                    <button class="btn" id="nextBtn">Câu Tiếp Theo</button>
                    <button class="btn" id="submitBtn" style="background-color: var(--success); margin-left: auto;">Nộp Bài</button>
                </div>
            </div>

            <!-- 3. Kết quả bài thi -->
            <div id="resultView" class="card hidden">
                <h1>Kết Quả Làm Bài</h1>
                <p class="subtitle" id="resultModeLabel">Chế độ thi thử</p>
                
                <div class="result-stats">
                    <div class="stat-box">
                        <div class="stat-num" id="statScore">0/10</div>
                        <div class="stat-label">Số câu đúng</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-num" id="statPercent">0%</div>
                        <div class="stat-label">Tỷ lệ chính xác</div>
                    </div>
                </div>

                <div class="nav-actions" style="margin-top: 24px;">
                    <button class="btn" id="reviewBtn">Xem Lại Lỗi Sai</button>
                    <button class="btn btn-secondary" id="restartBtn">Làm Bài Mới</button>
                </div>
            </div>

        </div>

        <!-- Sidebar Panel (Bản đồ câu hỏi) -->
        <div class="card sidebar-card hidden" id="sidebarContainer">
            <h3 style="font-size: 1rem; margin-bottom: 4px;">Danh sách câu hỏi</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px;" id="sidebarDesc">Bấm vào số để chuyển câu nhanh.</p>
            <div class="grid-container" id="questionsGrid"></div>
        </div>
    </div>

        const sidebarContainer = document.getElementById('sidebarContainer');
        
        const moduleSelect = document.getElementById('moduleSelect');
        const modeSelect = document.getElementById('modeSelect');
        const startBtn = document.getElementById('startBtn');
        
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const quizProgress = document.getElementById('quizProgress');
        const quizModeBadge = document.getElementById('quizModeBadge');
        
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const submitBtn = document.getElementById('submitBtn');
        
        const questionsGrid = document.getElementById('questionsGrid');
        const statScore = document.getElementById('statScore');
        const statPercent = document.getElementById('statPercent');
        const resultModeLabel = document.getElementById('resultModeLabel');
        
        const reviewBtn = document.getElementById('reviewBtn');
        const restartBtn = document.getElementById('restartBtn');

        // Init App
        startBtn.addEventListener('click', startQuiz);
        prevBtn.addEventListener('click', () => navigateQuestion(currentIdx - 1));
        nextBtn.addEventListener('click', () => navigateQuestion(currentIdx + 1));
        submitBtn.addEventListener('click', finishQuiz);
        restartBtn.addEventListener('click', resetApp);
        reviewBtn.addEventListener('click', enterReviewMode);

        function startQuiz() {
            const selectedModule = moduleSelect.value;
            quizMode = modeSelect.value;
            isReviewMode = false;
            userAnswers = {};

            // Lọc dữ liệu theo phần học
            if (selectedModule === 'ALL') {
                quizData = [...rawQuizData];
            } else {
                quizData = rawQuizData.filter(q => q.part === selectedModule);
            }

            if(quizData.length === 0) {
                alert("Không có câu hỏi nào trong mục này!");
                return;
            }

            // Giao diện chuyển đổi
            setupView.classList.add('hidden');
            quizView.classList.remove('hidden');
            sidebarContainer.classList.remove('hidden');
            mainContainer.classList.add('playing');

            // Cập nhật text chế độ học
            quizModeBadge.innerText = quizMode === "PRACTICE" ? "Chế độ: Luyện tập (Check câu)" : "Chế độ: Thi thử (Check kết quả sau)";
            
            // Render bản đồ câu hỏi bên sườn
            renderSidebarGrid();

            currentIdx = 0;
            showQuestion(currentIdx);
        }

        function showQuestion(index) {
            currentIdx = index;
            const item = quizData[index];
            
            // Cập nhật tiến độ
            quizProgress.innerText = `Câu hỏi ${index + 1}/${quizData.length} (${item.part})`;
            questionText.innerText = `${item.part} - Câu ${item.num}: ${item.question}`;
            
            // Cập nhật trạng thái các nút chuyển câu
            prevBtn.disabled = index === 0;
            if (index === quizData.length - 1) {
                nextBtn.classList.add('hidden');
                if (!isReviewMode) submitBtn.classList.remove('hidden');
            } else {
                nextBtn.classList.remove('hidden');
                submitBtn.classList.add('hidden');
            }

            if (isReviewMode) {
                submitBtn.classList.add('hidden');
            }

            // Render danh sách đáp án
            optionsContainer.innerHTML = '';
            item.options.forEach(opt => {
                const optDiv = document.createElement('div');
                optDiv.className = 'option-item';
                optDiv.innerHTML = `<span class="option-prefix">${opt.id}.</span> <span>${opt.text}</span>`;
                
                // Xử lý logic hiển thị tùy thuộc vào Chế độ làm bài
                if (quizMode === "PRACTICE") {
                    // Chế độ Luyện tập: Đã click chọn là hiển thị Đúng/Sai luôn
                    if (userAnswers[index]) {
                        if (opt.id === item.answer) {
                            optDiv.classList.add('correct'); // Phương án chuẩn hiển thị Xanh
                        } else if (opt.id === userAnswers[index]) {
                            optDiv.classList.add('incorrect'); // Phương án chọn sai hiển thị Đỏ
                        }
                    } else {
                        // Chưa chọn thì cho phép click
                        optDiv.addEventListener('click', () => selectOptionPractice(opt.id));
                    }
                } else {
                    // Chế độ Thi thử (Hoặc đang ở chế độ xem lại kết quả bài thi)
                    if (isReviewMode) {
                        if (opt.id === item.answer) {
                            optDiv.classList.add('correct');
                        } else if (opt.id === userAnswers[index] && userAnswers[index] !== item.answer) {
                            optDiv.classList.add('incorrect');
                        }
                    } else {
                        // Đang trong lúc làm bài thi thử bình thường
                        if (userAnswers[index] === opt.id) {
                            optDiv.classList.add('selected');
                        }
                        optDiv.addEventListener('click', () => selectOptionExam(opt.id));
                    }
                }
                
                optionsContainer.appendChild(optDiv);
            });

            // Đồng bộ trạng thái active trên sidebar
            document.querySelectorAll('.grid-item').forEach((grid, idx) => {
                if (idx === index) grid.classList.add('active');
                else grid.classList.remove('active');
            });
        }

        // Click đáp án ở chế độ Luyện tập (Check từng câu)
        function selectOptionPractice(optionId) {
            userAnswers[currentIdx] = optionId;
            const item = quizData[currentIdx];
            
            // Cập nhật ngay lưới sidebar để hiển thị đúng / sai trực quan
            const gridItem = document.getElementById(`grid-${currentIdx}`);
            if (optionId === item.answer) {
                gridItem.classList.add('right');
            } else {
                gridItem.classList.add('wrong');
            }
            
            // Render lại câu hỏi hiện tại để hiện màu sắc kết quả
            showQuestion(currentIdx);
        }

        // Click đáp án ở chế độ Thi thử (Check khi xong hết)
        function selectOptionExam(optionId) {
            userAnswers[currentIdx] = optionId;
            
            // Cập nhật trạng thái đã điền lên ô sidebar tương ứng
            const gridItem = document.getElementById(`grid-${currentIdx}`);
            gridItem.classList.add('filled');
            
            // Render lại để nhận màu xanh dương đang chọn
            showQuestion(currentIdx);
        }

        function navigateQuestion(targetIndex) {
            if (targetIndex >= 0 && targetIndex < quizData.length) {
                showQuestion(targetIndex);
            }
        }

        function renderSidebarGrid() {
            questionsGrid.innerHTML = '';
            quizData.forEach((_, idx) => {
                const gridItem = document.createElement('div');
                gridItem.className = 'grid-item';
                gridItem.id = `grid-${idx}`;
                gridItem.innerText = idx + 1;
                gridItem.addEventListener('click', () => showQuestion(idx));
                questionsGrid.appendChild(gridItem);
            });
            document.getElementById('sidebarDesc').innerText = quizMode === "PRACTICE" ? "Xanh: Đúng, Đỏ: Sai." : "Xanh dương: Câu đã chọn.";
        }

        function finishQuiz() {
            // Xác nhận nộp bài nếu chọn chế độ thi thử
            if (quizMode === "EXAM") {
                const unansweredCount = quizData.length - Object.keys(userAnswers).length;
                if (unansweredCount > 0) {
                    if (!confirm(`Bạn còn ${unansweredCount} câu chưa trả lời. Bạn vẫn muốn nộp bài chứ?`)) {
                        return;
                    }
                }
            }

            // Tính điểm số
            let score = 0;
            quizData.forEach((item, idx) => {
                if (userAnswers[idx] === item.answer) {
                    score++;
                }
            });

            // Hiển thị màn hình kết quả
            quizView.classList.add('hidden');
            sidebarContainer.classList.add('hidden');
            mainContainer.classList.remove('playing');
            resultView.classList.remove('hidden');

            // Đổ dữ liệu thống kê
            statScore.innerText = `${score}/${quizData.length}`;
            statPercent.innerText = `${Math.round((score / quizData.length) * 100)}%`;
            resultModeLabel.innerText = quizMode === "PRACTICE" ? "Chế độ: Luyện tập từng câu" : "Chế độ: Thi thử (Hệ thống đã khóa đáp án)";
        }

        function enterReviewMode() {
            // Chuyển sang giao diện xem lại bài làm để rà soát lỗi đúng sai
            isReviewMode = true;
            resultView.classList.add('hidden');
            quizView.classList.remove('hidden');
            sidebarContainer.classList.remove('hidden');
            mainContainer.classList.add('playing');

            // Cập nhật màu sắc tổng quan cho toàn bộ Grid bản đồ câu hỏi
            quizData.forEach((item, idx) => {
                const gridItem = document.getElementById(`grid-${idx}`);
                gridItem.className = 'grid-item'; // reset các class cũ
                if (userAnswers[idx] === item.answer) {
                    gridItem.classList.add('right');
                } else {
                    gridItem.classList.add('wrong');
                }
            });

            currentIdx = 0;
            showQuestion(currentIdx);
        }

        function resetApp() {
            resultView.classList.add('hidden');
            quizView.classList.add('hidden');
            sidebarContainer.classList.add('hidden');
            mainContainer.classList.remove('playing');
            setupView.classList.remove('hidden');
        }
    </script>
</body>
</html>
